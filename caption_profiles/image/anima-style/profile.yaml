name: anima-style
media: image
display_name: "Estilo (Anima)"
description: "Anima style LoRA: caption starts with @trigger. then dense hybrid tags/prose."
concurrency: 64
vars:
  - name: trigger
    required: true
stages:
  - id: tags
    type: wd14
    threshold: 0.35
  - id: caption
    type: llm
    provider: openrouter
    model: meta/muse-spark-1.3-contributor
    fallback:
      - google/gemini-3.8-flash
      - x-ai/grok-4.7
    system_prompt_file: system.md
    user_prompt_file: user.md
    extract_json: caption
    reasoning_effort: minimal
    params:
      response_format:
        type: json_object
    retries: 1
    validate:
      - not_empty
      - type: contains
        value: "{{trigger}}"
