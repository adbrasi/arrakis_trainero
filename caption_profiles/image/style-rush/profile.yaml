# Style Rush captions: the generic-style prompts, with Gemini as the primary.
# The images Gemini refuses are the ones gpt-image-2 also tends to refuse, and
# the conversion phase reads that list (captions.json `fallback`) to avoid
# paying for slots that would be refused.
name: style-rush
media: image
display_name: "Style Rush"
description: "generic-style prompts with Gemini first, so its refusals predict gpt-image-2's."
concurrency: 64
vars:
  - name: trigger
    required: true
stages:
  - id: tags
    type: wd14
    threshold: 0.35
  - id: caption
    type: llm
    provider: openrouter
    model: google/gemini-3.8-flash
    fallback:
      - meta/muse-spark-1.3-contributor
      - x-ai/grok-4.7
    system_prompt_file: ../generic-style/system.md
    user_prompt_file: ../generic-style/user.md
    extract_json: caption
    reasoning_effort: minimal
    params:
      response_format:
        type: json_object
    retries: 1
    validate:
      - not_empty
      - type: contains
        value: "{{trigger}}"
